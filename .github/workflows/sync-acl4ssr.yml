name: Sync ACL4SSR NoAuto

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "scripts/sync_acl4ssr.py"
      - ".github/workflows/sync-acl4ssr.yml"

permissions:
  contents: write

concurrency:
  group: sync-acl4ssr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and merge
        run: python3 scripts/sync_acl4ssr.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subconverter/ACL4SSR_Online_Full_NoAuto.ini
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: sync ACL4SSR NoAuto"
          git push
