# 示例片段：将 rule-providers 合并到主配置同名映射，rules 插入现有规则顶部
# 将 USER 改成 GitHub 用户名；策略组名字与主配置一致
rule-providers:
  custom-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/1962247851/proxy-configs/main/rules/direct.yaml
    path: ./rule_provider/custom-direct.yaml
    interval: 3600
  custom-reject:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/1962247851/proxy-configs/main/rules/reject.yaml
    path: ./rule_provider/custom-reject.yaml
    interval: 3600
  custom-proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/1962247851/proxy-configs/main/rules/proxy.yaml
    path: ./rule_provider/custom-proxy.yaml
    interval: 3600
rules:
  - RULE-SET,custom-direct,DIRECT
  - RULE-SET,custom-reject,REJECT
  - RULE-SET,custom-proxy,🚀 节点选择
